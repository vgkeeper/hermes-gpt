services:
  opencode:
    image: node:22-bookworm
    container_name: hermes-opencode
    user: "1000:1000"
    working_dir: /workspaces
    command:
      - /opt/opencode/node_modules/.bin/opencode
      - serve
      - --hostname
      - 127.0.0.1
      - --port
      - "4096"
      - --pure
      - --log-level
      - ERROR
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
      - /home/node/.config/opencode:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
    environment:
      HOME: /home/node
      XDG_CONFIG_HOME: /home/node/.config
      XDG_DATA_HOME: /home/node/.local/share
      XDG_CACHE_HOME: /tmp/cache
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_CONFIG: /opencode.json
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"hermes-readonly","model":"hermes-proxy/openai/gpt-6-luna"}'
      OPENCODE_CONFIG_DIR: /home/node/.config/opencode
    volumes:
      - hermes-opencode-app:/opt/opencode:ro
      - hermes-opencode-state:/home/node/.local
      - ${OPENCODE_CONFIG_FILE:?set OPENCODE_CONFIG_FILE}:/opencode.json:ro
      - ${OPENCODE_WORKSPACE_SOURCE:?set OPENCODE_WORKSPACE_SOURCE}:/workspaces:ro
      - ${OPENCODE_AGENT_CONFIG_DIR:?set OPENCODE_AGENT_CONFIG_DIR}:/home/node/.config/opencode/agents:ro
    networks:
      - hermes-opencode-int

  opencode-auth-proxy:
    image: ${OPENCODE_NGINX_IMAGE:?set OPENCODE_NGINX_IMAGE}
    container_name: hermes-opencode-auth-proxy
    network_mode: "service:opencode"
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      - opencode
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=101,gid=101
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${OPENCODE_PROXY_HTPASSWD_FILE:?set OPENCODE_PROXY_HTPASSWD_FILE}:/run/secrets/opencode.htpasswd:ro

volumes:
  hermes-opencode-app:
    external: true
  hermes-opencode-state:
    external: true

networks:
  hermes-opencode-int:
    external: true
